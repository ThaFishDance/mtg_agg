[project]
name = "mtg-aggregator-server"
version = "0.1.0"
description = "Independent FastAPI backend for MTG Aggregator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.4",
    "uvicorn",
]

[dependency-groups]
dev = [
 "pytest",
 "poetry",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
